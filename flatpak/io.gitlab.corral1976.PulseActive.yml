app-id: io.gitlab.corral1976.PulseActive
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pulse

rename-desktop-file: pulse-active.desktop
rename-icon: pulse

finish-args:
  - --share=network
  - --filesystem=host-os:ro
  - --talk-name=org.gnome.Mutter.DisplayConfig

modules:
  - name: lm-sensors
    buildsystem: simple
    build-commands:
      - make PREFIX=/app ETCDIR=/app/etc MANDIR=/app/share/man BUILD_STATIC_LIB=0 -j${FLATPAK_BUILDER_N_JOBS}
      - make install PREFIX=/app ETCDIR=/app/etc MANDIR=/app/share/man BUILD_STATIC_LIB=0
    cleanup:
      - /include
      - /lib/*.so
      - /lib/pkgconfig
      - /bin/sensors-conf-convert
      - /share/man
    sources:
      - type: archive
        url: https://github.com/lm-sensors/lm-sensors/archive/refs/tags/V3-6-2.tar.gz
        sha256: c6a0587e565778a40d88891928bf8943f27d353f382d5b745a997d635978a8f0

  - name: pciutils
    buildsystem: simple
    build-commands:
      - make PREFIX=/app SBINDIR=/app/bin IDSDIR=/app/share/hwdata MANDIR=/app/share/man DNS=no ZLIB=no LIBKMOD=no HWDB=no SHARED=no -j${FLATPAK_BUILDER_N_JOBS}
      - make install PREFIX=/app SBINDIR=/app/bin IDSDIR=/app/share/hwdata MANDIR=/app/share/man DNS=no ZLIB=no LIBKMOD=no HWDB=no SHARED=no
    cleanup:
      - /bin/setpci
      - /bin/pcilmr
      - /bin/update-pciids
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/pciutils/pciutils/archive/refs/tags/v3.15.0.tar.gz
        sha256: 06f467642057599acf396bc17340452fac3308f1e08be19e0c32587e42d7017b

  - name: pulse
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
      - install -Dm644 flatpak/io.gitlab.corral1976.PulseActive.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
          - flatpak/*.flatpak
      - type: patch
        path: flatpak-sandbox.patch
